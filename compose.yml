name: at-mqtt-sn

services:
  broker:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_pub -h 127.0.0.1 -p 1883 -t _healthcheck -m ok",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  gateway:
    build:
      context: ./gateway
    restart: unless-stopped
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - "1884:1884/udp"
    volumes:
      - ./gateway/config.yaml:/app/config.yaml:ro
    environment:
      CONFIG_PATH: /app/config.yaml
      LOG_LEVEL: INFO

  publisher:
    build:
      context: ./publisher
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_started
    volumes:
      - ./publisher/config.yaml:/app/config.yaml:ro
    environment:
      CONFIG_PATH: /app/config.yaml
      LOG_LEVEL: INFO

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    privileged: true
    ports:
      - "8123:8123"
    environment:
      - TZ=America/Sao_Paulo

    volumes:
      - ha-config:/config
      - /etc/localtime:/etc/localtime:ro

volumes:
  ha-config:
  mosquitto-data:
